<!DOCTYPE html>
<html lang='en'>
<head>
	<meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <link rel='stylesheet' href='./assets/analyse-iteration.css'>

    <title>Analyse Iteration</title>
</head>
<body>
	<div class='steps'>
        <div class='steps_step steps_step-0'>start</div>
        <div class='steps_step steps_step-1'>jsonify csv</div>
        <div class='steps_step steps_step-2'>jirify json</div>
        <div class='steps_active-step steps_step steps_step-3'>analyse iteration</div>
    </div>

    <div class='steps_header-bar steps_step-3'></div>
    <div class='steps_header'>
        <span class='title steps_step-3-text'>Analyse Iteration</span>
        <span class='sub-title'>Generate stats for workitems included in a planned iteration</span>
    </div>

    <div class='content'>
        <div class='properties'>
            <span id='fileName'></span>
        </div>

        <div id='section_userInput' class='userInput'></div>

        <div class='controls'>
            <button id='loadJsonButton' title='select JSON file to analyse'>load workitems</button>
            <input type='file' id='filePicker' accept='.json' style='display:none'>

            <button id='analyseButton' style='display:none'>analyse</button>

            <button id='downloadButton' style='display:none'>download CSV</button>
        </div>

        <div id='dataViewer'></div>
    </div>

    <script src='./assets/analyse-iteration.js'></script>
</body>
</html>
