<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <link rel='stylesheet' href='./assets/jsonify-csv.css'>

    <title>Jsonify CSV</title>
</head>
<body>
    <div class='steps'>
        <div class='steps_step steps_step-0'>start</div>
        <div class='steps_active-step steps_step steps_step-1'>jsonify csv</div>
        <div class='steps_step steps_step-2'>jirify json</div>
        <div class='steps_step steps_step-3'>analyse iteration</div>
    </div>

    <div class='steps_header-bar steps_step-1'></div>
    <div class='steps_header'>
        <span class='title steps_step-1-text'>Jsonify CSV</span>
        <span class='sub-title'>Convert CSV to JSON</span>
    </div>

    <div class='content'>
        <div class='properties'>
            <span id='fileName'></span>
        </div>

        <div class='controls'>
            <button id='loadCSVButton' title='select CSV file to convert to JSON'>load CSV</button>
            <input type='file' id='filePicker' accept='.csv' style='display:none'>    

            <button id='downloadButton' style='display:none'>download JSON</button>
        </div>
        
        <div id='dataViewer'></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src='./assets/jsonify-csv.js'></script>
</body>
</html>
