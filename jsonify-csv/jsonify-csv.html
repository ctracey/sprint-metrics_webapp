<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <link rel='stylesheet' href='./assets/jsonify-csv.css'>

    <title>Jsonify CSV</title>
</head>
<body>
    <div>
        <span class='title'>Jsonify CSV</span>
        <span class='sub-title'>Convert CSV to JSON</span>
    </div>
    
    <div class='properties'>
        <span id='fileName'></span>
    </div>

    <div class='controls'>
        <button id='loadCSVButton' title='select CSV file to convert to JSON'>load CSV</button>
        <input type='file' id='filePicker' accept='.csv' style='display:none'>    

        <button id='downloadButton' style='display:none'>download JSON</button>
    </div>
    
    <div id='dataViewer'></div>

    <script src='./assets/jsonify-csv.js'></script>
</body>
</html>
