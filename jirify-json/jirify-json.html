<!DOCTYPE html>
<html lang='en'>
<head>
	<meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <link rel='stylesheet' href='./assets/jirify-json.css'>

    <title>Jirify JSON</title>
</head>
<body>
	<div class='steps'>
        <div class='steps_step steps_step-0'>start</div>
        <div class='steps_step steps_step-1'>jsonify csv</div>
        <div class='steps_active-step steps_step steps_step-2'>jirify json</div>
        <div class='steps_step steps_step-3'>analyse iteration</div>
    </div>

    <div class='steps_header-bar steps_step-2'></div>
    <div class='steps_header'>
        <span class='title steps_step-2-text'>Jirify JSON</span>
        <span class='sub-title'>Structure JSON to consistently represent Jira Workitems</span>
    </div>

    <div class='content'>
        <div class='properties'>
            <span id='fileName'></span>
        </div>

        <div class='controls'>
            <button id='loadJsonButton' title='select JSON file to structure'>load JSON</button>
            <input type='file' id='filePicker' accept='.json' style='display:none'>

            <button id='convertButton' title='create new json file for work item structure' style='display:none'>convert</button>

            <button id='downloadButton' style='display:none'>download JSON</button>
        </div>

        <div id='dataViewer'></div>
    </div>

	<script src='./workitemModelDefinition.js'></script>
    <script src='./assets/jirify-json.js'></script>
</body>
</html>
