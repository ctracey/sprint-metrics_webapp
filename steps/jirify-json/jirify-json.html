<!DOCTYPE html>
<html lang='en'>
<head>
	<meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <link rel='stylesheet' href='./assets/jirify-json.css'>

    <title>Jirify JSON</title>
</head>
<body>
	<div class='steps'>
        <a href='../../start.html' class='steps_step steps_step-0'>overview</a>
        <a href='../export-csv/export-csv.html' class='steps_step steps_step-1'>export csv</a>
        <a href='../jsonify-csv/jsonify-csv.html' class='steps_step steps_step-2'>jsonify csv</a>
        <a href='../jirify-json/jirify-json.html' class='steps_active-step steps_step steps_step-3'>jirify json</a>
        <a href='../analyse-iteration/analyse-iteration.html' class='steps_step steps_step-4'>analyse iteration</a>
        <a href='../visualise-metrics/visualise-metrics.html' class='steps_step steps_step-5'>visualise metrics</a>
    </div>

    <div class='steps_header-bar steps_step-3'></div>
    <div class='steps_header'>
        <span class='title steps_step-3-text'>Jirify JSON</span>
        <span class='sub-title'>Structure JSON to consistently represent Jira Workitems</span>
    </div>

    <div class='content'>
        <div class='properties'>
            <span id='fileName'></span>
        </div>

        <div class='controls'>
            <button id='loadJsonButton' title='select JSON file to structure' class='control-button steps_step-3'>load JSON</button>
            <input type='file' id='filePicker' accept='.json' style='display:none'>

            <button id='convertButton' title='create new json file for work item structure' style='display:none' class='control-button steps_step-3'>convert</button>

            <button id='downloadButton' style='display:none' class='control-button steps_step-3'>download JSON</button>
        </div>

        <div id='dataViewer'></div>
    </div>

	<script src='./workitemModelDefinition.js'></script>
    <script src='./assets/jirify-json.js'></script>
</body>
</html>
