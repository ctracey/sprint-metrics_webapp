<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <link rel='stylesheet' href='../assets/css/sprint-metrics_webapp.css'>
    <link rel='stylesheet' href='../assets/css/view/step-by-step/jsonify-csv.css'>
    
    <link rel='stylesheet' href='../assets/components/steps/steps.css'>
    <link rel='stylesheet' href='../assets/components/json-preview/json-preview.css'>

    <title>Jsonify CSV</title>
</head>
<body>
    <div class='steps'>
        <a href='./overview.html' class='steps_step steps_step-0'>overview</a>
        <a href='./export-csv.html' class='steps_step steps_step-1' title='export work items from jira (csv)'>export csv</a>
        <a href='./jsonify-csv.html' class='steps_active-step steps_step steps_step-2' title='convert downloaded csv to json (json)'>jsonify csv</a>
        <a href='./jirify-json.html' class='steps_step steps_step-3' title='convert downloaded json to data model (json)'>jirify json</a>
        <a href='./analyse-iteration.html' class='steps_step steps_step-4' title='convert data model to calculated metrics (csv)'>analyse iteration</a>
        <a href='./visualise-metrics.html' class='steps_step steps_step-5' title='convert downloaded metrics data to visualised dashboard (xlxs)'>visualise metrics</a>
    </div>

    <div class='steps_header-bar steps_step-2'></div>
    <div class='steps_header'>
        <span class='title steps_step-2-text'>Jsonify CSV</span>
        <span class='sub-title'>Convert Jira Export CSV to JSON Format</span>
    </div>

    <div class='content'>
        <div class='properties'>
            <span id='fileName'></span>
        </div>

        <div class='controls'>
            <button id='loadCSVButton' title='select CSV file to convert to JSON' class='control-button steps_step-2'>load Jira export CSV</button>
            <input type='file' id='filePicker' accept='.csv' style='display:none'>    

            <button id='downloadButton' style='display:none' class='control-button steps_step-2'>download JSON</button>
            <button id='nextStepButton' href='./jirify-json.html' style='display:none' class='control-button steps_step-3'>next step</button>
        </div>
        
        <div id='dataViewer'></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src='../assets/components/json-preview/json-preview.js'></script>
    <script src='../assets/components/next-step_button/next-step_button.js'></script>
    <script src='../assets/js/util/view-util.js'></script>
    
    <script src='../assets/js/util/file-util.js'></script>
    <script src='../assets/js/util/data-converter-util.js'></script>
    <script src='../assets/js/view/step-by-step/jsonify-csv.js'></script>
</body>
</html>
