<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <link rel='stylesheet' href='../assets/css/sprint-metrics_webapp.css'>
    <link rel='stylesheet' href='../assets/css/view/streamline/analyse-iteration.css'>

    <link rel='stylesheet' href='../assets/components/steps/steps.css'>

    <title>Analyse Iteration</title>
</head>
<body>
    <div class='steps'>
        <a href='./overview.html' class='steps_step steps_step-0'>overview</a>
        <a href='./export-csv.html' class='steps_step steps_step-1' title='export work items from jira (csv)'>export csv</a>
        <a href='./analyse-iteration.html' class='steps_active-step steps_step steps_step-3' title='convert data model to calculated metrics (csv)'>analyse iteration</a>
        <a href='./visualise-metrics.html' class='steps_step steps_step-5' title='convert downloaded metrics data to visualised dashboard (xlxs)'>visualise metrics</a>
    </div>

    <div class='steps_header-bar steps_step-3'></div>
    <div class='steps_header'>
        <span class='title steps_step-3-text'>Analyse Iteration</span>
        <span class='sub-title'>Calculate metrics for structured work items included in an iteration</span>
    </div>

    <div class='content'>
        <div class='properties'>
            <span id='fileName'></span>
        </div>

        <div id='section_userInput' class='userInput'></div>

        <div class='controls'>
            <button id='loadCSVButton' title='select CSV file to convert to JSON' class='control-button steps_step-2'>load Jira export CSV</button>
            <input type='file' id='filePicker' accept='.csv' style='display:none'>

            <button id='analyseButton' style='display:none' class='control-button steps_step-4'>analyse</button>

            <button id='downloadButton' style='display:none' class='control-button steps_step-4'>download analysis CSV</button>
            <button id='nextStepButton' style='display:none' href='./visualise-metrics.html' class='control-button steps_step-5'>next step</button>
        </div>
    </div>

    <script src="../assets/js/lib/papaparse.min-5.3.0.js"></script>
    <script src='../assets/components/sprint-details-form/sprint-details-form.js'></script>
    <script src='../assets/components/next-step_button/next-step_button.js'></script>
    <script src='../assets/js/util/view-util.js'></script>
    
    <script src='../assets/js/util/file-util.js'></script>
    <script src='../assets/js/util/data-converter-util.js'></script>

    <script src='../config//workitem-model-definition-config.js'></script>
    <script src='../assets/js/workitem-model.js'></script>
    <script src='../assets/js/steps/jirify-json-step.js'></script>
    <script src='../assets/js/steps/analyse-iteration-step.js'></script>
    
    <script src='../assets/js/view/streamline/analyse-iteration.js'></script>
</body>
</html>
